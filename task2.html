
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joke Generator</title>

     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="bg-amber-100  p-5">

    <h1 class="text-4xl font-bold text-center text-amber-950 mt-5 mb-8">
         Joke Generator
    </h1>

    <div class="bg-white  mx-auto p-6 rounded-2xl text-center">

        <h3 id="setup" class="text-xl font-semibold text-gray-800 mb-4">
        </h3>

        <h3 id="punchline" class="text-lg text-amber-700 mb-6">
        </h3>

        <div class="flex justify-center gap-3 ">
            <button onclick="getData()"
                class="bg-amber-800 text-white px-5 py-2 rounded-lg hover:bg-amber-950">
                Generate New
            </button>

            <button onclick="addTofav()"
                class="bg-green-700 text-white px-5 py-2 rounded-lg hover:bg-green-900">
                Add to Fav 
            </button>
        </div>

    </div>

    <h1 class="text-3xl font-bold text-center text-red-700 mt-10 mb-5">
        Favourites 
    </h1>

    <div class="max-w-6xl mx-auto overflow-x-auto rounded-xl">
        <table class="w-full bg-white text-left">
            <thead class="bg-amber-800 text-white">
                <tr>
                    <th class="p-3">ID</th>
                    <th class="p-3">Type</th>
                    <th class="p-3">Setup</th>
                    <th class="p-3">Punchline</th>
                    <th class="p-3">Action</th>
                </tr>
            </thead>

            <tbody id="result" class="divide-y divide-amber-100">
            </tbody>
        </table>
    </div>

</body>

<script>
    let apiRes = null;

    let favourites = JSON.parse(localStorage.getItem('data')) || [];

    const getData = async () => {
        try {
            apiRes = await fetch(
                'https://official-joke-api.appspot.com/random_joke'
            );

            apiRes = await apiRes.json();

            document.querySelector('#setup').innerText = apiRes.setup;
            document.querySelector('#punchline').innerText = apiRes.punchline;

        } catch (error) {
            console.log(error);
            alert('error occured');
        }
    };

    getData();

    const addTofav = () => {
        if (!apiRes) {
            alert('Please wait for the joke to load');
            return;
        }

        let alreadyExists = favourites.some(
            (eachData) => eachData.id === apiRes.id
        );

        if (alreadyExists) {
            alert('Already added to favourites');
            return;
        }

        favourites.unshift(apiRes);

        let jsonData = JSON.stringify(favourites);
        localStorage.setItem('data', jsonData);

        showFavourites();
        alert('added to favourites');
    };

    const showFavourites = () => {
        favourites = JSON.parse(localStorage.getItem('data')) || [];

        let resultEl = document.querySelector('#result');
        resultEl.innerHTML = "";

        resultEl.innerHTML = favourites.map(
            (eachData) => `
                <tr class="hover:bg-amber-50">
                    <td class="p-3">${eachData.id}</td>
                    <td class="p-3">${eachData.type}</td>
                    <td class="p-3">${eachData.setup}</td>
                    <td class="p-3">${eachData.punchline}</td>
                    <td class="p-3">
                        <button
                            onclick="deleteData(${eachData.id})"
                            class="bg-red-600 text-white px-3 py-1 rounded-md hover:bg-red-800">
                            Delete
                        </button>
                    </td>
                </tr>
            `
        ).join("");
    };

    const deleteData = (dId) => {
        favourites = JSON.parse(localStorage.getItem('data')) || [];

        let filteredData = favourites.filter(
            (eachData) => eachData.id !== dId
        );

        localStorage.setItem('data', JSON.stringify(filteredData));

        showFavourites();
        alert('deleted successfully');
    };

    showFavourites();
</script>

</html>
